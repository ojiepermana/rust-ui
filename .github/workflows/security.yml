name: Dependency advisories
on:
  pull_request:
    paths: [Cargo.lock, Cargo.toml, '**/Cargo.toml', .github/workflows/security.yml]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install 1.100.0 --profile minimal
      - name: Install pinned advisory scanner
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Scan lockfile against RustSec
        run: cargo audit --file Cargo.lock
